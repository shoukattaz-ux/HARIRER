name: Build APK

on:
  push:
    branches: [main, "ccr-*"]
    paths:
      - "hairstyle-ai/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    paths:
      - "hairstyle-ai/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
      HAS_RELEASE_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      HAS_STABLE_DEBUG_KEY: ${{ secrets.DEBUG_KEYSTORE_BASE64 != '' }}
      HAS_R2: ${{ secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' && (vars.R2_PUBLIC_BASE_URL != '' || secrets.R2_PUBLIC_BASE_URL != '') }}
      # Not secret: the S3 API address only contains the Cloudflare account ID
      R2_ENDPOINT_DEFAULT: https://94cd5cc82406d3f30d1eb8b8c245d661.r2.cloudflarestorage.com
    defaults:
      run:
        working-directory: hairstyle-ai

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Robolectric needs Java 21 to simulate Android SDK 35+ (the tests use SDK 36)
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          # The default also installs the removed 'tools' package, which fails
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # Optional configuration from repository secrets (Settings → Secrets and variables → Actions).
      # Nothing secret is stored in the repository.
      # Every build gets a higher versionCode so installed apps see it as an update
      - name: Set version
        run: |
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.2.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Write .env from secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PLAY_LICENSE_KEY: ${{ secrets.PLAY_LICENSE_KEY }}
          UPDATE_MANIFEST_URL: ${{ secrets.UPDATE_MANIFEST_URL || (vars.R2_PUBLIC_BASE_URL != '' && format('{0}/update.json', vars.R2_PUBLIC_BASE_URL)) || '' }}
        run: |
          : > .env
          [ -n "$GEMINI_API_KEY" ] && echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
          [ -n "$PLAY_LICENSE_KEY" ] && echo "PLAY_LICENSE_KEY=$PLAY_LICENSE_KEY" >> .env
          [ -n "$UPDATE_MANIFEST_URL" ] && echo "UPDATE_MANIFEST_URL=$UPDATE_MANIFEST_URL" >> .env
          echo "Configured: $(cut -d= -f1 .env | tr '\n' ' ')"

      - name: Write google-services.json from secrets
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        if: env.HAS_GOOGLE_SERVICES == 'true'
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

      # debug.keystore is git-ignored; use a stored one if provided so debug builds can update each other
      - name: Prepare debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log

      # Compiler errors are buried above long stack traces; repeat them at the end of the log
      - name: Show build errors
        if: failure()
        run: |
          echo "==== Kotlin/Java errors ===="
          grep -E '^e: |error:|What went wrong' -A2 build.log | head -150 || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hairlook-debug-apk
          path: hairstyle-ai/app/build/outputs/apk/debug/*.apk

      - name: Run unit tests
        run: gradle testDebugUnitTest

      # Publish to Cloudflare R2 for sideloaded installs, only when tests pass and builds are signed with
      # a stable key (otherwise Android would refuse the update). Credentials come from repository secrets.
      - name: Publish update to Cloudflare R2
        if: env.HAS_R2 == 'true' && env.HAS_STABLE_DEBUG_KEY == 'true' && github.event_name != 'pull_request'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT || env.R2_ENDPOINT_DEFAULT }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL || secrets.R2_PUBLIC_BASE_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || 'hairstyleapp' }}
          RELEASE_NOTES: ${{ github.event.head_commit.message || 'Improvements and fixes' }}
        run: |
          pip install --quiet boto3
          NOTES=$(printf '%s' "$RELEASE_NOTES" | head -n 1)
          python scripts/publish_update.py app/build/outputs/apk/debug/app-debug.apk \
            --version-code "$VERSION_CODE" --version-name "$VERSION_NAME" --notes "$NOTES"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: hairstyle-ai/app/build/reports/tests/

      # Signed release APK, only when the upload keystore is configured as secrets
      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"
          KEYSTORE_PATH="$RUNNER_TEMP/upload-key.jks" gradle assembleRelease
          rm -f "$RUNNER_TEMP/upload-key.jks"

      - name: Upload release APK
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hairlook-release-apk
          path: hairstyle-ai/app/build/outputs/apk/release/*.apk
